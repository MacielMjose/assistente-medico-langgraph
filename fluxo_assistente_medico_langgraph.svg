<svg width="680" height="1160" viewBox="0 0 680 1160" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo LangGraph do assistente médico</title>
<desc>Diagrama do grafo mostrando entrada, validações, busca de paciente, consulta ao modelo LLM, geração de explicação, validação profissional, sugestão de tratamentos, tratamento de erros e registro de auditoria.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="1160" fill="#FFFFFF"/>

<!-- main vertical connectors -->
<line x1="300" y1="56" x2="300" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="140" x2="300" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="236" x2="300" y2="276" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="320" x2="300" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="416" x2="300" y2="456" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="512" x2="300" y2="552" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="608" x2="300" y2="648" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="692" x2="300" y2="732" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="788" x2="300" y2="828" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- branch out to error/alt handlers -->
<line x1="400" y1="298" x2="460" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="388" x2="460" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- split from sugerir_tratamentos -->
<path d="M300,872 L300,894 L280,894 L280,916" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M300,872 L300,894 L490,894 L490,916" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- convergence into log -->
<path d="M280,960 L280,978 L340,978 L340,1000" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490,960 L490,978 L440,978 L440,1000" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M540,320 L540,1015 L485,1015" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75" marker-end="url(#arrow-coral)"/>
<path d="M540,416 L580,416 L580,1030 L485,1030" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75" marker-end="url(#arrow-coral)"/>

<line x1="385" y1="1044" x2="385" y2="1084" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- start -->
<rect x="250" y="20" width="100" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="300" y="42" text-anchor="middle" font-size="14" fill="#2C2C2A">início</text>

<!-- obter_entrada -->
<rect x="200" y="96" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Obter entrada</text>

<!-- validar_dados_paciente -->
<rect x="200" y="180" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="204" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Validar dados</text>
<text x="300" y="223" text-anchor="middle" font-size="12" fill="#0C447C">CPF, idade, sintomas</text>

<!-- buscar_paciente -->
<rect x="200" y="276" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Buscar paciente</text>

<!-- tratar_erro_busca -->
<rect x="460" y="276" width="160" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="540" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Erro na busca</text>

<!-- validar_contexto_pergunta -->
<rect x="200" y="360" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="384" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Validar contexto</text>
<text x="300" y="403" text-anchor="middle" font-size="12" fill="#0C447C">Pergunta é médica?</text>

<!-- tratar_pergunta_fora_contexto -->
<rect x="460" y="360" width="160" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="540" y="384" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Fora de contexto</text>
<text x="540" y="403" text-anchor="middle" font-size="12" fill="#993C1D">Pergunta não médica</text>

<!-- obter_dados_paciente_paralelo -->
<rect x="200" y="456" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="480" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Obter dados</text>
<text x="300" y="499" text-anchor="middle" font-size="12" fill="#0C447C">Execução paralela</text>

<!-- consultar_modelo_llm -->
<rect x="200" y="552" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="576" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Consultar modelo</text>
<text x="300" y="595" text-anchor="middle" font-size="12" fill="#0C447C">LLM médico</text>

<!-- gerar_explicacao -->
<rect x="200" y="648" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="674" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Gerar explicação</text>

<!-- validar_com_profissional -->
<rect x="200" y="732" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="756" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Validar com</text>
<text x="300" y="775" text-anchor="middle" font-size="12" fill="#0C447C">profissional</text>

<!-- sugerir_tratamentos -->
<rect x="200" y="828" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="300" y="854" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Sugerir tratamentos</text>

<!-- emitir_alertas -->
<rect x="190" y="916" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="280" y="942" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Emitir alertas</text>

<!-- marcar_consulta -->
<rect x="400" y="916" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="942" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Marcar consulta</text>

<!-- registrar_log_auditoria -->
<rect x="285" y="1000" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="385" y="1026" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Registrar log</text>

<!-- end -->
<rect x="335" y="1084" width="100" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="385" y="1106" text-anchor="middle" font-size="14" fill="#2C2C2A">fim</text>

</svg>
