services:
  db:
    image: pgvector/pgvector:pg17
    container_name: assistente-medico-pg
    environment:
      POSTGRES_DB: assistente_medico
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: medico_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medico -d assistente_medico"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    container_name: assistente-medico-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Descomente para usar GPU NVIDIA (requer nvidia-container-toolkit no host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama_data:
